<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Login — Portal de Cultura Digital & Arena</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
    .login-card { background: #1a1a1e; border: 2px solid #e67e22; border-radius: 12px; padding: 35px; width: 100%; max-width: 400px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); text-align: center; }
    h2 { color: #e67e22; margin-top: 0; font-size: 22px; }
    p { color: #a8a8b3; font-size: 13px; margin-bottom: 25px; }
    .form-group { margin-bottom: 15px; text-align: left; }
    label { display: block; font-size: 12px; color: #a8a8b3; margin-bottom: 5px; font-weight: bold; }
    input { width: 100%; padding: 10px; background: #121214; border: 1px solid #29292e; border-radius: 6px; color: #fff; font-size: 14px; box-sizing: border-box; }
    input:focus { border-color: #00b4d8; outline: none; }
    .btn-submit { width: 100%; background: #00b4d8; color: #121214; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; margin-top: 10px; transition: opacity 0.2s; }
    .btn-submit:hover { opacity: 0.85; }
    .btn-sec { background: transparent; color: #e67e22; border: 1px solid #e67e22; margin-top: 10px; }
    .btn-sec:hover { background: #e67e22; color: #121214; }
    #msg-erro { color: #f75a68; font-size: 13px; margin-top: 15px; }
    #msg-sucesso { color: #04d361; font-size: 13px; margin-top: 15px; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🎮 Portal de Cultura Digital</h2>
    <p>Acesse com suas credenciais de estudante ou faça seu cadastro inicial.</p>

    <div class="form-group">
      <label for="campo-usuario">Usuário / Login</label>
      <input type="text" id="campo-usuario" placeholder="Digite seu usuário">
    </div>

    <div class="form-group">
      <label for="campo-senha">Senha</label>
      <input type="password" id="campo-senha" placeholder="Digite sua senha">
    </div>

    <button class="btn-submit" onclick="entrar()">Entrar no Portal</button>
    <button class="btn-submit btn-sec" onclick="cadastrar()">Solicitar Cadastro</button>

    <div id="msg-erro"></div>
    <div id="msg-sucesso"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://pnybenlfazdjgqnyuypn.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_2pzNR2UAF2-jfiXQDqrA3w_lwFryik0';
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function entrar() {
      const usuario = document.getElementById('campo-usuario').value.trim();
      const senha = document.getElementById('campo-senha').value.trim();
      const msgErro = document.getElementById('msg-erro');
      const msgSucesso = document.getElementById('msg-sucesso');
      msgErro.innerText = '';
      msgSucesso.innerText = '';

      if (!usuario || !senha) {
        msgErro.innerText = 'Preencha usuário e senha!';
        return;
      }

      // Consulta o aluno no Supabase
      const { data: alunos, error } = await _supabase
        .from('se_alunos')
        .select('*')
        .eq('usuario', usuario)
        .eq('senha', senha);

      if (error) {
        msgErro.innerText = 'Erro na conexão com o banco de dados.';
        return;
      }

      if (!alunos || alunos.length === 0) {
        msgErro.innerText = 'Usuário ou senha incorretos!';
        return;
      }

      const aluno = alunos[0];

      if (aluno.autorizado !== true) {
        msgErro.innerText = 'Seu cadastro está pendente de autorização pelo professor!';
        return;
      }

      // Salva a sessão localmente e redireciona para o portal do aluno
      localStorage.setItem('aluno_logado_id', aluno.id);
      localStorage.setItem('aluno_logado_nome', aluno.nome);
      localStorage.setItem('aluno_logado_moedas', aluno.moedas || 0);

      window.location.href = 'index.html';
    }

    async function cadastrar() {
      const usuario = document.getElementById('campo-usuario').value.trim();
      const senha = document.getElementById('campo-senha').value.trim();
      const msgErro = document.getElementById('msg-erro');
      const msgSucesso = document.getElementById('msg-sucesso');
      msgErro.innerText = '';
      msgSucesso.innerText = '';

      if (!usuario || !senha) {
        msgErro.innerText = 'Preencha usuário e senha para cadastrar!';
        return;
      }

      const nomeSolicitado = prompt('Digite seu nome completo:');
      if (!nomeSolicitado) return;

      const turmaSolicitada = prompt('Digite sua turma (ex: 81):') || 'Geral';

      const { error } = await _supabase.from('se_alunos').insert([{
        nome: nomeSolicitado,
        usuario: usuario,
        senha: senha,
        turma: turmaSolicitada,
        autorizado: false,
        moedas: 0
      }]);

      if (error) {
        msgErro.innerText = 'Erro ao solicitar cadastro: ' + error.message;
      } else {
        msgSucesso.innerText = 'Solicitação enviada com sucesso! Aguarde a autorização do professor.';
      }
    }
  </script>
</body>
</html>
