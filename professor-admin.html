<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo - Professor</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121214; color: #e1e1e6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .admin-card { background: #1a1a1e; border: 2px solid #e67e22; border-radius: 12px; padding: 25px; width: 100%; max-width: 1100px; box-sizing: border-box; box-shadow: 0 4px 15px rgba(0,0,0,0.5); margin-bottom: 20px; }
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 13px; }
        .admin-table th, .admin-table td { border: 1px solid #29292e; padding: 10px; text-align: left; }
        .admin-table th { background: #202024; color: #e67e22; }
        .btn-sys { border: none; padding: 6px 12px; font-weight: bold; border-radius: 6px; cursor: pointer; font-size: 12px; background: #e67e22; color: #121214; }
        .btn-success { background: #04d361; color: #121214; }
        .btn-danger { background: #f75a68; color: #fff; }
        input, textarea { padding: 8px; margin: 5px 0; background: #121214; border: 1px solid #29292e; color: #fff; border-radius: 6px; width: 100%; box-sizing: border-box; }
    </style>
</head>
<body>

  <!-- GESTÃO DE DISCIPLINAS E LINKS -->
  <div class="admin-card">
    <h2 style="color: #e67e22; margin-top:0;">📚 Gestão de Disciplinas & Links Externos</h2>
    <p style="color: #a8a8b3; font-size: 13px;">Adicione as disciplinas que aparecerão para os alunos na aba Aulas & Materiais com o respetivo link de acesso.</p>
    
    <div style="display: grid; grid-template-columns: 2fr 3fr 100px 120px; gap: 10px; margin-top: 15px;">
      <input type="text" id="nova-disciplina-titulo" placeholder="Nome da Disciplina">
      <input type="text" id="novo-disciplina-link" placeholder="Link (ex: https://thiagomgp.github.io/cultura-digital/)">
      <input type="text" id="nova-disciplina-turma" placeholder="Turma (TODAS / 81)" value="TODAS">
      <button class="btn-sys btn-success" onclick="adicionarDisciplina()">+ Adicionar</button>
    </div>
    <textarea id="nova-disciplina-desc" rows="2" placeholder="Breve descrição da disciplina..." style="margin-top: 10px;"></textarea>

    <table class="admin-table" style="margin-top: 20px;">
      <thead>
        <tr>
          <th>Título</th>
          <th>Link de Acesso</th>
          <th>Turma Permitida</th>
          <th>Descrição</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="tabela-disciplinas-corpo">
        <tr><td colspan="5">A carregar disciplinas...</td></tr>
      </tbody>
    </table>
  </div>

  <script>
    const SUPABASE_URL = "https://pnybenlfazdjgqnyuypn.supabase.co";
    const SUPABASE_KEY = "sb_publishable_2pzNR2UAF2-jfiXQDqrA3w_lwFryik0";
    const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function carregarPainel() {
      const { data: disciplinas, error } = await _supabase.from('se_disciplinas').select('*').order('id', { ascending: true });
      const tbody = document.getElementById('tabela-disciplinas-corpo');
      tbody.innerHTML = '';

      if (error || !disciplinas || disciplinas.length === 0) {
        tbody.innerHTML = '<tr><td colspan="5">Nenhuma disciplina registada.</td></tr>';
        return;
      }

      disciplinas.forEach(disc => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><input type="text" id="disc_tit_${disc.id}" value="${disc.titulo || ''}"></td>
          <td><input type="text" id="disc_link_${disc.id}" value="${disc.link || ''}"></td>
          <td><input type="text" id="disc_turma_${disc.id}" value="${disc.turma_permitida || 'TODAS'}" style="width: 80px;"></td>
          <td><textarea id="disc_desc_${disc.id}" rows="2">${disc.descricao || ''}</textarea></td>
          <td>
            <button class="btn-sys" onclick="salvarDisciplina(${disc.id})">Salvar</button>
            <button class="btn-sys btn-danger" onclick="removerDisciplina(${disc.id})">Excluir</button>
          </td>
        `;
        tbody.appendChild(tr);
      });
    }

    async function adicionarDisciplina() {
      const titulo = document.getElementById('nova-disciplina-titulo').value.trim();
      const link = document.getElementById('novo-disciplina-link').value.trim();
      const turma_permitida = document.getElementById('nova-disciplina-turma').value.trim() || 'TODAS';
      const descricao = document.getElementById('nova-disciplina-desc').value.trim();

      if (!titulo || !link) {
        alert('Preencha o título e o link da disciplina!');
        return;
      }

      const { error } = await _supabase.from('se_disciplinas').insert([{ titulo, link, turma_permitida, descricao }]);
      if (error) alert('Erro ao adicionar: ' + error.message);
      else {
        alert('Disciplina adicionada com sucesso!');
        document.getElementById('nova-disciplina-titulo').value = '';
        document.getElementById('novo-disciplina-link').value = '';
        document.getElementById('nova-disciplina-desc').value = '';
        carregarPainel();
      }
    }

    async function salvarDisciplina(id) {
      const titulo = document.getElementById(`disc_tit_${id}`).value;
      const link = document.getElementById(`disc_link_${id}`).value;
      const turma_permitida = document.getElementById(`disc_turma_${id}`).value;
      const descricao = document.getElementById(`disc_desc_${id}`).value;

      const { error } = await _supabase.from('se_disciplinas').update({ titulo, link, turma_permitida, descricao }).eq('id', id);
      if (error) alert('Erro ao atualizar: ' + error.message);
      else { alert('Disciplina atualizada com sucesso!'); carregarPainel(); }
    }

    async function removerDisciplina(id) {
      if(!confirm("Excluir esta disciplina?")) return;
      const { error } = await _supabase.from('se_disciplinas').delete().eq('id', id);
      if (error) alert('Erro ao excluir: ' + error.message);
      carregarPainel();
    }

    window.onload = carregarPainel;
  </script>
</body>
</html>
