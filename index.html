<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal Acadêmico — Cultura Digital & Disciplinas</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] }
                }
            }
        }
    </script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen flex flex-col justify-between antialiased">

    <script>
        const SUPABASE_URL = "https://pnybenlfazdjgqnyuypn.supabase.co";
        const SUPABASE_KEY = "sb_publishable_2pzNR2UAF2-jfiXQDqrA3w_lwFryik0";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let activeStudent = null;

        window.addEventListener('DOMContentLoaded', async () => {
            const saved = sessionStorage.getItem('active_student');
            if (saved) {
                activeStudent = JSON.parse(saved);
                document.getElementById('student-select-area').classList.add('hidden');
                document.getElementById('student-welcome-area').classList.remove('hidden');
                document.getElementById('student-name-text').innerText = activeStudent.nome;
                document.getElementById('student-class-text').innerText = activeStudent.turma;
            }
            await carregarDisciplinas();
        });

        async function selectStudent() {
            const name = document.getElementById('student-name-input').value.trim();
            const turma = document.getElementById('student-turma-select').value;
            if (!name) {
                alert("Por favor, digite seu nome completo!");
                return;
            }

            try {
                let { data: existing, error } = await _supabase
                    .from('se_alunos')
                    .select('*')
                    .eq('nome', name)
                    .eq('turma', turma)
                    .maybeSingle();

                if (!existing) {
                    const { data: created, error: insertError } = await _supabase
                        .from('se_alunos')
                        .insert([{ nome: name, usuario: name.toLowerCase().replace(/\s+/g, ''), senha: '123', turma: turma, autorizado: true }])
                        .select()
                        .single();
                    if (insertError) throw insertError;
                    existing = created;
                }

                activeStudent = existing;
                sessionStorage.setItem('active_student', JSON.stringify(activeStudent));
                
                document.getElementById('student-select-area').classList.add('hidden');
                document.getElementById('student-welcome-area').classList.remove('hidden');
                document.getElementById('student-name-text').innerText = activeStudent.nome;
                document.getElementById('student-class-text').innerText = activeStudent.turma;

                await carregarDisciplinas();
            } catch (err) {
                console.error("Erro ao registrar/buscar aluno:", err);
                alert("Erro ao conectar com o banco de dados Supabase.");
            }
        }

        function switchStudent() {
            sessionStorage.removeItem('active_student');
            activeStudent = null;
            document.getElementById('student-welcome-area').classList.add('hidden');
            document.getElementById('student-select-area').classList.remove('hidden');
            carregarDisciplinas();
        }

        async function carregarDisciplinas() {
            try {
                // Consulta a tabela se_disciplinas no Supabase
                const { data: disciplinas, error } = await _supabase.from('se_disciplinas').select('*').order('id', { ascending: true });
                const grid = document.getElementById('disciplinas-grid');
                grid.innerHTML = '';

                if (error || !disciplinas || disciplinas.length === 0) {
                    // Disciplina padrão de Cultura Digital se a tabela estiver vazia
                    grid.innerHTML = `
                        <div class="bg-slate-800 border border-slate-700/80 rounded-2xl p-6 flex flex-col justify-between shadow-xl">
                            <div>
                                <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Trilha BNCC</span>
                                <h3 class="text-lg font-bold text-white mt-1 mb-2">Cultura Digital & Arena</h3>
                                <p class="text-xs text-slate-400 leading-relaxed mb-4">Informática prática, segurança, atalhos, manutenção e montagem de hardware.</p>
                            </div>
                            <button onclick="acederDisciplina('https://thiagomgp.github.io/cultura-digital/')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 cursor-pointer">
                                <span>Aceder à Disciplina</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    `;
                    return;
                }

                disciplinas.forEach(disc => {
                    const turmaAluno = activeStudent ? activeStudent.turma : 'TODAS';
                    if (disc.turma_permitida && disc.turma_permitida !== 'TODAS' && disc.turma_permitida !== turmaAluno) {
                        return; // Filtra por turma
                    }

                    const card = document.createElement('div');
                    card.className = "bg-slate-800 border border-slate-700/80 hover:border-cyan-500/50 rounded-2xl p-6 flex flex-col justify-between shadow-xl transition-all duration-300";
                    card.innerHTML = `
                        <div>
                            <span class="text-xs font-bold text-cyan-400 uppercase tracking-wider">Turma: ${disc.turma_permitida || 'Geral'}</span>
                            <h3 class="text-lg font-bold text-white mt-1 mb-2">${disc.titulo}</h3>
                            <p class="text-xs text-slate-400 leading-relaxed mb-4">${disc.descricao || 'Conteúdo pedagógico autorizado.'}</p>
                        </div>
                        <button onclick="acederDisciplina('${disc.link}')" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs transition flex items-center justify-center gap-2 cursor-pointer">
                            <span>Aceder à Disciplina</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </button>
                    `;
                    grid.appendChild(card);
                });
            } catch (err) {
                console.error("Erro ao carregar disciplinas:", err);
            }
        }

        function acederDisciplina(urlBase) {
            if (!activeStudent || !activeStudent.id) {
                alert("Por favor, digite seu nome e clique em 'Entrar' no topo da página antes de aceder à disciplina!");
                return;
            }
            // Autentica o aluno passando os dados via parâmetros na URL do link externo
            const urlFinal = `${urlBase}?id=${activeStudent.id}&nome=${encodeURIComponent(activeStudent.nome)}&turma=${encodeURIComponent(activeStudent.turma)}`;
            window.open(urlFinal, '_blank');
        }
    </script>

    <!-- CABEÇALHO -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-cyan-500 to-emerald-400 flex items-center justify-center text-slate-950 text-xl font-black shadow-lg">
                    <i class="fa-solid fa-laptop-code"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl text-white leading-tight">Portal Acadêmico</h1>
                    <p class="text-xs text-slate-400">Plataforma Imersiva & Disciplinas</p>
                </div>
            </div>

            <!-- Área de Identificação do Aluno -->
            <div id="student-select-area" class="flex flex-wrap items-center gap-2 bg-slate-900 border border-slate-700 p-2 rounded-xl text-xs">
                <input type="text" id="student-name-input" placeholder="Digite seu Nome Completo" class="bg-slate-800 border border-slate-700 text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-cyan-400">
                <select id="student-turma-select" class="bg-slate-800 border border-slate-700 text-white px-3 py-1.5 rounded-lg focus:outline-none focus:border-cyan-400">
                    <option value="81">Turma 81</option>
                    <option value="101">Turma 101</option>
                    <option value="102">Turma 102</option>
                    <option value="201">Turma 201</option>
                    <option value="301">Turma 301</option>
                </select>
                <button onclick="selectStudent()" class="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-3 py-1.5 rounded-lg transition cursor-pointer">
                    Entrar
                </button>
            </div>

            <!-- Boas-vindas quando logado -->
            <div id="student-welcome-area" class="hidden flex items-center gap-4">
                <div class="flex items-center gap-2 bg-slate-900 border border-slate-700 px-3 py-1.5 rounded-xl text-xs">
                    <i class="fa-solid fa-user-circle text-cyan-400 text-lg"></i>
                    <div>
                        <div id="student-name-text" class="font-bold text-white">--</div>
                        <div id="student-class-text" class="text-slate-400 text-[10px]">--</div>
                    </div>
                </div>
                <button onclick="switchStudent()" class="text-xs text-slate-400 hover:text-rose-400 transition cursor-pointer" title="Trocar Aluno">
                    <i class="fa-solid fa-right-from-bracket text-base"></i> Sair
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-1">
        <div class="mb-8 bg-gradient-to-r from-slate-800 to-slate-800/60 border border-slate-700 rounded-2xl p-6 shadow-xl">
            <span class="text-xs font-bold uppercase tracking-widest text-cyan-400">Aulas & Materiais</span>
            <h2 class="text-2xl font-extrabold text-white mt-1">Disciplinas Autorizadas</h2>
            <p class="text-slate-300 text-xs sm:text-sm mt-2 max-w-2xl leading-relaxed">
                Selecione abaixo a disciplina desejada. O sistema fará a sua autenticação automática ao abrir o conteúdo.
            </p>
        </div>

        <div id="disciplinas-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- Carregado via Supabase -->
        </div>
    </main>

    <footer class="bg-slate-950 border-t border-slate-800 py-4 text-center text-xs text-slate-500">
        Escola Estadual de Ensino Médio Dom Antônio Reis • Portal Acadêmico &copy; 2026
    </footer>

</body>
</html>
